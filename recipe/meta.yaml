{% set name = "pykep" %}
{% set version = "3.0.0" %}
{% set sha256 = "27b350d24e5c15632f6a11aab8624cf76cf9604a5cab17761cc0459c94d2c7d0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://github.com/esa/pykep/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake >=3.28,<3.31
    - make       # [unix]
  host:
    - python
    - libboost-devel >=1.73
    - pybind11 >=2.11
    - heyoka >=7
    - fmt >=10
    - spdlog
    - xtensor >=0.26
    - xtensor-blas
    - blas
    - blas-devel
    - pagmo-devel
    - eigen >=3,<5
    - nlopt <2.10.1
  run:
    - python
    - heyoka.py >=7
    - matplotlib-base
    - numpy
    - scipy
    - pygmo
    - sgp4
    - blas

about:
  home: https://esa.github.io/pykep/
  license: MPL-2.0
  license_file: COPYING
  summary: pykep is a scientific library providing basic tools for interplanetary trajectory design.

extra:
  recipe-maintainers:
    - darioizzo
