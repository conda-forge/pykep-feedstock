{% set name = "pykep" %}
{% set version = "3.1.0" %}
{% set sha256 = "b5f92f9de8b7c9c6d293aa54eb5556d39af9dd05dfeddff8720f44f384a17f84" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://github.com/esa/pykep/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - pybind11 >=3                           # [build_platform != target_platform]
    - cmake >=3.28,<3.31
    - make       # [unix]
  host:
    - python
    - libboost-devel >=1.73
    - pybind11 >=3
    - pybind11-abi
    - heyoka =7.13.*
    - fmt >=10
    - spdlog
    - xtensor >=0.26
    - xtensor-blas
    - blas
    - blas-devel
    - libblas * *openblas  # [linux]
    - pagmo-devel
    - eigen >=3,<5
    - nlopt
  run:
    - python
    - heyoka.py >=7
    - matplotlib-base
    - numpy
    - scipy
    - pygmo
    - sgp4
    - blas
    - libblas * *openblas  # [linux]
    - spiceypy

about:
  home: https://esa.github.io/pykep/
  license: MPL-2.0
  license_file: COPYING
  summary: pykep is a scientific library providing basic tools for interplanetary trajectory design.

extra:
  recipe-maintainers:
    - darioizzo
